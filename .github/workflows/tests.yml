name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Run tests in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          env HOME="$test_home" \
            CODEX_HOME="$test_home/.codex" \
            CLAUDE_CONFIG_DIR="$test_home/.claude" \
            GIT_CONFIG_GLOBAL="$test_home/.gitconfig" \
            GIT_AUTHOR_NAME="Test User" \
            GIT_AUTHOR_EMAIL="test@example.invalid" \
            GIT_COMMITTER_NAME="Test User" \
            GIT_COMMITTER_EMAIL="test@example.invalid" \
            python3 -m pytest tests -q
          env HOME="$test_home" DENO_DIR="$test_home/.cache/deno" \
            deno test --allow-env \
            plugins/codex-session-logging/supabase/functions/codex-session-ingest
